<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赵财期权末日轮策略 - 试用版授权码申请</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1515 30%, #1a0a0a 70%, #0a0505 100%);
            color: #fff;
        }
        .fire-glow {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.3) 0%, transparent 70%);
            border-radius: 50%; animation: pulse-glow 3s ease-in-out infinite; z-index: 0;
        }
        .fire-glow:nth-of-type(1) { left: -100px; bottom: -100px; animation-delay: 1.5s; }
        .fire-glow:nth-of-type(2) { right: -50px; bottom: -50px; }
        .battle-scene {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at bottom, rgba(255, 107, 53, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at top right, rgba(220, 38, 38, 0.1) 0%, transparent 40%);
            z-index: 0;
        }
        .smoke {
            position: fixed; bottom: 0; left: 0; right: 0; height: 30%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent); z-index: 1; pointer-events: none;
        }
        .scanline {
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 2px);
            position: fixed; inset: 0; pointer-events: none; z-index: 100;
        }
        .noise {
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03; pointer-events: none; z-index: 99;
        }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
        @keyframes shimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .container { position: relative; z-index: 10; width: 100%; max-width: 480px; }
        .card {
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px; padding: 24px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.2), inset 0 0 30px rgba(255, 107, 53, 0.05);
        }
        .title-section { text-align: center; margin-bottom: 24px; }
        .title {
            font-size: 24px; font-weight: bold;
            background: linear-gradient(90deg, #ff6b35, #ffd700, #ff6b35);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;
        }
        .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 12px; }
        .motto { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #ff6b35; }
        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 8px; }
        .input-field {
            width: 100%; background: rgba(10, 10, 15, 0.5);
            border: 1px solid rgba(75, 85, 99, 0.3); border-radius: 12px;
            padding: 16px 20px; color: #fff; font-size: 16px; outline: none; transition: all 0.3s;
        }
        .input-field:focus { border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .input-field::placeholder { color: #4b5563; }
        .input-field.shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .btn {
            width: 100%; background: linear-gradient(90deg, #ff6b35, #dc2626);
            color: #fff; border: none; border-radius: 12px; padding: 16px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4); transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 107, 53, 0.6); }
        .btn-small {
            background: rgba(255, 107, 53, 0.3); border: 1px solid rgba(255, 107, 53, 0.4);
            color: #ff6b35; border-radius: 8px; padding: 8px 16px; font-size: 12px; cursor: pointer; transition: all 0.3s;
        }
        .btn-small:hover { background: rgba(255, 107, 53, 0.5); }
        .result-section { margin-top: 24px; animation: fadeIn 0.5s ease-out; }
        .code-box { background: rgba(10, 10, 15, 0.5); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .code-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .code-label { font-size: 12px; color: #6b7280; }
        .copy-btn {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); border: none; color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .code-textarea {
            width: 100%; background: rgba(0, 0, 0, 0.5); border: none; border-radius: 8px;
            padding: 12px; color: #ffd700; font-family: 'Courier New', monospace;
            font-size: 14px; resize: none; outline: none; min-height: 80px;
        }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .info-box { background: rgba(10, 10, 15, 0.5); border-radius: 12px; padding: 12px; }
        .info-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .info-value { font-size: 14px; font-weight: medium; color: #fff; }
        .info-value.gold { color: #ffd700; }
        .member-box { background: linear-gradient(90deg, rgba(255, 107, 53, 0.2), rgba(220, 38, 38, 0.2));
            border: 1px solid rgba(255, 107, 53, 0.3); border-radius: 12px; padding: 16px; text-align: center;
        }
        .member-text { color: #ffd700; font-size: 14px; font-weight: medium; }
        .footer { text-align: center; margin-top: 16px; font-size: 12px; color: #6b7280; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .hidden { display: none; }
        .alert-box { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.5); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 16px; }
        .alert-text { color: #ef4444; font-size: 14px; font-weight: medium; }
        .alert-subtext { color: #ffd700; font-size: 12px; margin-top: 10px; line-height: 1.8; }
        .alert-contact { color: #ff6b35; cursor: pointer; }

        /* 管理员面板 */
        .admin-toggle { text-align: center; margin-top: 16px; }
        .admin-panel {
            margin-top: 16px; background: rgba(10, 10, 15, 0.8); border-radius: 12px;
            border: 1px solid rgba(255, 107, 53, 0.3); padding: 16px; animation: fadeIn 0.3s ease-out;
        }
        .admin-title { color: #ff6b35; font-size: 14px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .admin-stats { display: flex; gap: 12px; margin-bottom: 12px; }
        .admin-stat { background: rgba(255, 107, 53, 0.1); border-radius: 8px; padding: 8px 12px; text-align: center; flex: 1; }
        .admin-stat-num { font-size: 20px; font-weight: bold; color: #ffd700; }
        .admin-stat-label { font-size: 11px; color: #6b7280; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .admin-table th { background: rgba(255, 107, 53, 0.2); color: #ff6b35; padding: 8px; text-align: left; border-bottom: 1px solid rgba(255, 107, 53, 0.3); }
        .admin-table td { padding: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #d1d5db; word-break: break-all; }
        .admin-table tr:hover td { background: rgba(255, 107, 53, 0.05); }
        .admin-actions { display: flex; gap: 8px; margin-top: 12px; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255, 107, 53, 0.2); color: #ff6b35; }
        .link-section { margin-top: 16px; padding: 12px; background: rgba(10, 10, 15, 0.5); border-radius: 12px; border: 1px solid rgba(255, 107, 53, 0.2); }
        .link-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: #9ca3af; }
        .link-item:last-child { margin-bottom: 0; }
        .link-item a { color: #ff6b35; text-decoration: none; transition: color 0.3s; }
        .link-item a:hover { color: #ffd700; }
        .link-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .scroll-wrap { max-height: 300px; overflow-y: auto; }
        .scroll-wrap::-webkit-scrollbar { width: 6px; }
        .scroll-wrap::-webkit-scrollbar-track { background: rgba(10, 10, 15, 0.5); border-radius: 3px; }
        .scroll-wrap::-webkit-scrollbar-thumb { background: rgba(255, 107, 53, 0.4); border-radius: 3px; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="fire-glow"></div>
    <div class="fire-glow"></div>
    <div class="battle-scene"></div>
    <div class="smoke"></div>
    <div class="scanline"></div>
    <div class="noise"></div>

    <div class="container">
        <div class="card">
            <div class="title-section">
                <div class="title">
                    <span>⚔️</span>
                    <span>赵财期权末日轮策略</span>
                    <span>🔥</span>
                </div>
                <p class="subtitle">试用版授权码申请</p>
                <div class="motto">
                    <span>定时重启</span>
                    <span>·</span>
                    <span>无限迭代</span>
                    <span>·</span>
                    <span>日益增进</span>
                </div>
            </div>

            <div id="alertBox" class="alert-box hidden">
                <p class="alert-text">⚠️ 该账号已申请过试用码</p>
                <p class="alert-subtext">
                    如觉得不错请购买正式码<br>
                    联系QQ: <span class="alert-contact" onclick="navigator.clipboard.writeText('64743885')">64743885</span> | 
                    微信: <span class="alert-contact" onclick="navigator.clipboard.writeText('zyzcfc')">zyzcfc</span>
                </p>
            </div>

            <!-- 输入区：UID + 联系方式放一起 -->
            <div class="input-group">
                <label class="input-label">战友智大领峰用户名</label>
                <input type="text" id="uid" placeholder="输入战友智大领峰用户名" class="input-field" maxlength="50">
            </div>
            <div class="input-group">
                <label class="input-label" style="color: #ff6b35;">联系方式（QQ / 微信）<span style="color:#ef4444;"> *必填</span></label>
                <input type="text" id="contact" placeholder="输入你的QQ号或微信号" class="input-field" maxlength="50">
            </div>

            <button onclick="go()" class="btn">
                <span>⚔️</span>
                <span>申请授权码</span>
                <span>⚔️</span>
            </button>

            <div id="result" class="result-section hidden">
                <div class="code-box">
                    <div class="code-header">
                        <span class="code-label">授权码</span>
                        <button onclick="copyCode()" id="copyBtn" class="copy-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <textarea id="code" class="code-textarea" readonly></textarea>
                </div>
                <div class="info-grid">
                    <div class="info-box">
                        <div class="info-label">战友智大领峰用户名</div>
                        <div id="showUid" class="info-value"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">授权到期日</div>
                        <div id="showExpire" class="info-value gold"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">联系方式</div>
                        <div id="showContact" class="info-value"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">申请时间</div>
                        <div id="showTime" class="info-value gold"></div>
                    </div>
                </div>
                <div class="member-box">
                    <p id="memberCount" class="member-text"></p>
                </div>
            </div>

            <!-- 管理员入口 -->
            <div class="admin-toggle">
                <button class="btn-small" onclick="toggleAdmin()">📋 管理员查看申请记录</button>
            </div>
            <div id="adminPanel" class="admin-panel hidden">
                <div class="admin-title">
                    <span>📊 申请记录管理</span>
                    <span class="badge" id="recordCount">0 条记录</span>
                </div>
                <div class="admin-stats">
                    <div class="admin-stat">
                        <div class="admin-stat-num" id="statTotal">0</div>
                        <div class="admin-stat-label">总申请</div>
                    </div>
                    <div class="admin-stat">
                        <div class="admin-stat-num" id="statToday">0</div>
                        <div class="admin-stat-label">今日</div>
                    </div>
                    <div class="admin-stat">
                        <div class="admin-stat-num" id="statExpired">0</div>
                        <div class="admin-stat-label">已过期</div>
                    </div>
                </div>
                <div class="admin-actions">
                    <button class="btn-small" onclick="exportCSV()">📥 导出 CSV</button>
                    <button class="btn-small" onclick="clearAll()">🗑️ 清空记录</button>
                </div>
                <div class="scroll-wrap" id="adminTableWrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>UID</th>
                                <th>联系方式</th>
                                <th>授权码</th>
                                <th>到期日</th>
                                <th>申请时间</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="link-section">
                <div class="link-item">
                    <span class="link-icon">💬</span>
                    <span>QQ群：</span>
                    <span onclick="navigator.clipboard.writeText('666181683')" style="color: #ff6b35; cursor: pointer;">666181683</span>
                </div>
                <div class="link-item">
                    <span class="link-icon">📖</span>
                    <a href="https://docs.qq.com/doc/DQ3RsSHpPV1hQTmdp" target="_blank">腾讯文档 · 赵财末日轮主观策略使用说明书</a>
                </div>
            </div>
        </div>
        <div class="footer">
            <span>💪</span>
            <span>末日边缘 搞钱联盟</span>
            <span>🕶️</span>
        </div>
    </div>

    <script>
        const CoreSecret = 8801088;
        const mapTable = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_";
        const TRIAL_DAYS = 30;
        const SUBMISSIONS_KEY = 'zhaocai_submissions';
        const USED_ACCOUNTS_KEY = 'zhaocai_used_accounts';

        function formatDate(date) {
            return date.getFullYear() + '-' + 
                String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                String(date.getDate()).padStart(2, '0');
        }

        function getExpireNum(date) {
            return parseInt(date.getFullYear() + 
                String(date.getMonth() + 1).padStart(2, '0') + 
                String(date.getDate()).padStart(2, '0'));
        }

        function getUsedAccounts() {
            return JSON.parse(localStorage.getItem(USED_ACCOUNTS_KEY) || '[]');
        }

        function isAccountUsed(uid) {
            let submissions = getSubmissions();
            return submissions.some(s => s.uid === uid);
        }

        function calculateSerial(uid, expireNum) {
            let uidSum = 0;
            for (let i = 1; i < uid.length; i++) {
                let c = uid[i];
                let v = mapTable.indexOf(c) + 1;
                uidSum += v;
            }
            uidSum += 1;
            let salt = uidSum * 10000 + CoreSecret;
            let v1 = expireNum * 3 + CoreSecret + salt;
            let v2 = expireNum + salt + CoreSecret + 99999;
            let serial = "1" + v1 + CoreSecret + v2;
            return { serial, uidSum };
        }

        function getSubmissions() {
            return JSON.parse(localStorage.getItem(SUBMISSIONS_KEY) || '[]');
        }

        function saveSubmission(sub) {
            let subs = getSubmissions();
            subs.push(sub);
            localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(subs));
        }

        function go() {
            let uid = document.getElementById("uid").value.toUpperCase().trim();
            let contact = document.getElementById("contact").value.trim();
            let uidField = document.getElementById("uid");
            let contactField = document.getElementById("contact");
            let alertBox = document.getElementById("alertBox");

            if (!uid) {
                uidField.classList.add("shake");
                setTimeout(() => uidField.classList.remove("shake"), 500);
                return;
            }
            
            if (!contact) {
                contactField.classList.add("shake");
                setTimeout(() => contactField.classList.remove("shake"), 500);
                return;
            }

            if (isAccountUsed(uid)) {
                alertBox.classList.remove("hidden");
                inputField.classList.add("shake");
                setTimeout(() => inputField.classList.remove("shake"), 500);
                document.getElementById("result").classList.add("hidden");
                return;
            }
            alertBox.classList.add("hidden");

            let now = new Date();
            let expireDate = new Date(now.getTime() + TRIAL_DAYS * 24 * 60 * 60 * 1000);
            let expireNum = getExpireNum(expireDate);
            let expireStr = formatDate(expireDate);
            let timeStr = formatDate(now) + ' ' + 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0');

            let result = calculateSerial(uid, expireNum);

            // 保存记录
            let submission = {
                uid: uid,
                contact: contact || '未填写',
                code: result.serial,
                expireDate: expireStr,
                time: timeStr,
                timestamp: Date.now()
            };
            saveSubmission(submission);

            // 显示结果
            document.getElementById("code").value = result.serial;
            document.getElementById("showUid").innerText = uid;
            document.getElementById("showExpire").innerText = expireStr;
            document.getElementById("showContact").innerText = contact || '未填写';
            document.getElementById("showTime").innerText = timeStr;

            let userNum = (result.uidSum % 100) + 101;
            document.getElementById("memberCount").innerText = '💪 你是第 ' + userNum + ' 位战友，你并不孤单！ 🕶️';

            document.getElementById("result").classList.remove("hidden");

            // 刷新管理员面板
            if (!document.getElementById("adminPanel").classList.contains("hidden")) {
                renderAdminPanel();
            }
        }

        function copyCode() {
            let code = document.getElementById("code").value;
            let btn = document.getElementById("copyBtn");
            navigator.clipboard.writeText(code).then(() => {
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                setTimeout(() => {
                    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                }, 2000);
            });
        }

        // 管理员面板
        function toggleAdmin() {
            let panel = document.getElementById("adminPanel");
            panel.classList.toggle("hidden");
            if (!panel.classList.contains("hidden")) {
                renderAdminPanel();
            }
        }

        function renderAdminPanel() {
            let subs = getSubmissions();
            let tbody = document.getElementById("adminTableBody");
            let today = formatDate(new Date());
            
            document.getElementById("recordCount").innerText = subs.length + ' 条记录';
            document.getElementById("statTotal").innerText = subs.length;
            document.getElementById("statToday").innerText = subs.filter(s => s.time.startsWith(today)).length;
            document.getElementById("statExpired").innerText = subs.filter(s => s.expireDate < today).length;

            if (subs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#6b7280;padding:24px;">暂无申请记录</td></tr>';
                return;
            }

            tbody.innerHTML = subs.map((s, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${s.uid}</td>
                    <td>${s.contact}</td>
                    <td style="font-family:monospace;font-size:11px;color:#ffd700;">${s.code}</td>
                    <td>${s.expireDate}</td>
                    <td>${s.time}</td>
                </tr>
            `).reverse().join('');
        }

        function exportCSV() {
            let subs = getSubmissions();
            if (subs.length === 0) return alert('暂无记录可导出');
            
            let csv = '序号,UID,联系方式,授权码,到期日,申请时间\n';
            subs.forEach((s, i) => {
                csv += `${i + 1},${s.uid},${s.contact},${s.code},${s.expireDate},${s.time}\n`;
            });
            
            let blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '授权码申请记录_' + formatDate(new Date()) + '.csv';
            a.click();
            URL.revokeObjectURL(blob);
        }

        function clearAll() {
            if (confirm('确定要清空所有申请记录吗？此操作不可撤销！')) {
                localStorage.removeItem(SUBMISSIONS_KEY);
                localStorage.removeItem(USED_ACCOUNTS_KEY);
                renderAdminPanel();
            }
        }
    </script>
</body>
</html>
