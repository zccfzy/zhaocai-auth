    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1515 30%, #1a0a0a 70%, #0a0505 100%);
            color: #fff;
            overflow: hidden;
        }
        .fire-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-glow 3s ease-in-out infinite;
            z-index: 0;
        }
        .fire-glow:nth-of-type(1) {
            left: -100px;
            bottom: -100px;
            animation-delay: 1.5s;
        }
        .fire-glow:nth-of-type(2) {
            right: -50px;
            bottom: -50px;
        }
        .battle-scene {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at bottom, rgba(255, 107, 53, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at top right, rgba(220, 38, 38, 0.1) 0%, transparent 40%);
            z-index: 0;
        }
        .smoke {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            z-index: 1;
            pointer-events: none;
        }
        .explosion-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(255, 107, 53, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            animation: pulse-glow 4s ease-in-out infinite;
            z-index: 0;
        }
        .explosion-glow:nth-of-type(4) {
            top: 10%;
            left: 20%;
        }
        .explosion-glow:nth-of-type(5) {
            top: 30%;
            right: 15%;
            animation-delay: 2s;
        }
        .scanline {
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 2px);
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
        .noise {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 99;
        }
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b35;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        .particle:nth-child(1) { left: 10%; top: 20%; }
        .particle:nth-child(2) { left: 85%; top: 35%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 25%; top: 60%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 70%; top: 75%; animation-delay: 0.5s; }
        .particle:nth-child(5) { left: 45%; top: 15%; animation-delay: 1.5s; }
        .particle:nth-child(6) { left: 5%; top: 80%; animation-delay: 2.5s; }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fire {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7); }
            100% { box-shadow: 0 0 0 20px rgba(255, 107, 53, 0); }
        }

            z-index: 10;
            width: 100%;
            max-width: 480px;
        }
        .card {

        .clock-label { font-size: 11px; color: #6b7280; margin-left: 6px; }
        .date-line { text-align: center; padding: 8px 0; margin-bottom: 8px; }
        .date-label { font-size: 12px; color: #6b7280; }
        .date-value { font-size: 14px; color: #f59e0b; font-weight: bold; font-family: 'Courier New', monospace; margin-left: 6px; letter-spacing: 1px; }
        .countdown-box { text-align: center; padding: 8px; margin-bottom: 12px; background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.2); border-radius: 8px; }
        .countdown-label { font-size: 11px; color: #6b7280; }

    <script>
        // === Keyboard protection ===
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                var target = e.target || e.srcElement;
                var isInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA';
                if (!isInput) {
                    switch(e.key.toLowerCase()) {
                        case 'c': case 's': case 'v': case 'x': case 'u': case 'i':
                            e.preventDefault();
                            break;
                    }
                }
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
        });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });

        // === Live Clock ===
        function updateClock() {
            let n=new Date();
            document.getElementById('clockTime').textContent=
                String(n.getHours()).padStart(2,'0')+':'+
                String(n.getMinutes()).padStart(2,'0')+':'+
                String(n.getSeconds()).padStart(2,'0');
        }
        setInterval(updateClock,1000); updateClock();

        // === Countdown ===
        let tmr=null;
        function startCountdown(e){
            if(tmr)clearInterval(tmr);
            let d=new Date(e+'T23:59:59+08:00');
            function tick(){
                let df=d-new Date();
                if(df<=0){document.getElementById('countdownValue').textContent='已到期';return}
                document.getElementById('countdownValue').textContent=
                    Math.floor(df/86400000)+' 天 '+
                    Math.floor((df%86400000)/3600000)+' 时 '+
                    Math.floor((df%3600000)/60000)+' 分';
            }
            tick(); tmr=setInterval(tick,60000);
        }

        // === Date Line ===
        function showDateLine(exp){
            let d=new Date(exp+'T00:00:00+08:00');
            d.setDate(d.getDate()-30);
            document.getElementById('showDate').textContent=
                d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            startCountdown(exp);
        }

        function hideFormAndShowDate(exp){
            document.querySelector('.code-box').classList.add('hidden');
            document.querySelector('.input-group').classList.add('hidden');
            document.getElementById('mainBtn').classList.add('hidden');
            document.querySelector('.info-grid').classList.add('hidden');
            document.querySelector('.member-box').classList.add('hidden');
            document.getElementById('dateLine').classList.remove('hidden');
            document.getElementById('countdownBox').classList.remove('hidden');
            showDateLine(exp);
        }

        // === Auth Core ===
        const CoreSecret = 8801088;
        const mapTable = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_";
        const TRIAL_DAYS = 30;
        const USED_ACCOUNTS_KEY = 'zhaocai_used_accounts';
        const ACCOUNT_CODES_KEY = 'zhaocai_account_codes';

        function formatDate(date) {
            let year = date.getFullYear();
            let month = String(date.getMonth() + 1).padStart(2, '0');
            let day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getExpireNum(date) {
            let year = date.getFullYear();
            let month = String(date.getMonth() + 1).padStart(2, '0');
            let day = String(date.getDate()).padStart(2, '0');
            return parseInt(year + month + day);
        }

        function getUsedAccounts() {
            return JSON.parse(localStorage.getItem(USED_ACCOUNTS_KEY) || '[]');
        }

        function getAccountCodes() {
            let data = JSON.parse(localStorage.getItem(ACCOUNT_CODES_KEY) || '{}');
            return data;
        }

        function getAccountCode(uid) {
            let codes = getAccountCodes();
            return codes[uid] || null;
        }

        function saveAccountCode(uid, code, uidSum, expireDate, expireNum) {
            let accountCodes = getAccountCodes();
            accountCodes[uid] = { code: code, uidSum: uidSum, time: Date.now(), expireDate: expireDate, expireNum: expireNum };
            localStorage.setItem(ACCOUNT_CODES_KEY, JSON.stringify(accountCodes));
        }

        function saveUsedAccount(uid) {
            let usedAccounts = getUsedAccounts();
            if (!usedAccounts.includes(uid)) {
                usedAccounts.push(uid);
                localStorage.setItem(USED_ACCOUNTS_KEY, JSON.stringify(usedAccounts));
            }
        }

        function isAccountUsed(uid) {
            return getUsedAccounts().includes(uid);
        }

        function calculateSerial(uid, expireNum) {
            let uidSum = 0;
            for (let i = 1; i < uid.length; i++) {
                let c = uid[i];
                let v = mapTable.indexOf(c) + 1;
                uidSum += v;
            }
            uidSum += 1;
            
            let salt = uidSum * 10000 + CoreSecret;
            let v1 = expireNum * 3 + CoreSecret + salt;
            let v2 = expireNum + salt + CoreSecret + 99999;
            let serial = "1" + v1 + CoreSecret + v2;
            
            return { serial: serial, uidSum: uidSum };
        }

        async function go() {
            let uid = document.getElementById("uid").value.toUpperCase().trim();
            let inputField = document.getElementById("uid");
            let alertBox = document.getElementById("alertBox");
            let btn = document.getElementById("mainBtn");
            
            if (!uid) {
                inputField.classList.add("shake");
                setTimeout(() => inputField.classList.remove("shake"), 500);
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span>⚔️</span><span>处理中...</span><span>⚔️</span>';
            
            try {
                let controller = new AbortController();
                let timeoutId = setTimeout(() => controller.abort(), 4000);
                try {
                    var response = await fetch(`https://1328173883-dz4q4z8i5a.ap-shanghai.tencentscf.com?uid=${encodeURIComponent(uid)}`);
                } catch(e) {}
                let data = await response.json();
                
                if (data.success) {
                    let existing = getAccountCode(uid);
                    if (existing) {
                        document.getElementById("code").value = existing.code;
                        document.getElementById("showUid").innerText = uid;
                        document.getElementById("showExpire").innerText = existing.expireDate;
                        document.getElementById("memberCount").innerText = '💪 你是第 ' + (existing.uidSum || '?') + ' 位战友，你并不孤单！ 🕶️';
                        document.getElementById("result").classList.remove("hidden");
                        alertBox.classList.add("hidden");
                    } else {
                        alertBox.classList.add("hidden");
                        saveUsedAccount(uid);
                        saveAccountCode(uid, data.data.code, data.data.userNum, data.data.expire, getExpireNum(new Date(data.data.expire)));
                        
                        document.getElementById("code").value = data.data.code;
                        document.getElementById("showUid").innerText = uid;
                        document.getElementById("showExpire").innerText = data.data.expire;
                        document.getElementById("memberCount").innerText = '💪 你是第 ' + data.data.userNum + ' 位战友，你并不孤单！ 🕶️';
                        document.getElementById("result").classList.remove("hidden");
                    }
                } else {
                    if (data.hasHistory && data.data) {
                        try {
                            let existing = getAccountCode(uid);
                            if (!existing) { saveUsedAccount(uid); saveAccountCode(uid, data.data.code, data.data.userNum, data.data.expire, getExpireNum(new Date(data.data.expire))); }
                        } catch(e) {}
                        document.getElementById("code").value = data.data.code;
                        document.getElementById("showUid").innerText = uid;
                        document.getElementById("showExpire").innerText = data.data.expire;
                        document.getElementById("memberCount").innerText = '💪 你是第 ' + (data.data.userNum || '?') + ' 位战友，你并不孤单！ 🕶️';
                        document.getElementById("result").classList.remove("hidden");
                        hideFormAndShowDate(data.data.expire);
                    }
                }
                
            } catch (error) {
                console.error('API请求失败:', error);
                
                let existing = getAccountCode(uid);
                if (existing) {
                    document.getElementById("code").value = existing.code;
                    document.getElementById("showUid").innerText = uid;
                    document.getElementById("showExpire").innerText = existing.expireDate;
                    document.getElementById("memberCount").innerText = '💪 你是第 ' + (existing.uidSum || '?') + ' 位战友，你并不孤单！ 🕶️';
                    document.getElementById("result").classList.remove("hidden");
                    alertBox.classList.add("hidden");
                    hideFormAndShowDate(existing.expireDate);
                } else {
                    let now = new Date();
                    let expireDate = new Date(now.getTime() + TRIAL_DAYS * 24 * 60 * 60 * 1000);
                    let expireNum = getExpireNum(expireDate);
                    let expireStr = formatDate(expireDate);
                    
                    let result = calculateSerial(uid, expireNum);
                    
                    saveUsedAccount(uid);
                    saveAccountCode(uid, result.serial, result.uidSum, expireStr, expireNum);
                    
                    document.getElementById("code").value = result.serial;
                    document.getElementById("showUid").innerText = uid;
                    document.getElementById("showExpire").innerText = expireStr;
                    
                    let userNum = (result.uidSum % 100) + 101;
                    document.getElementById("memberCount").innerText = '💪 你是第 ' + userNum + ' 位战友，你并不孤单！ 🕶️';
                    
                    document.getElementById("result").classList.remove("hidden");
                    alertBox.classList.add("hidden");
                    hideFormAndShowDate(expireStr);
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>⚔️</span><span>申请授权码</span><span>⚔️</span>';
            }
        }

        function copyCode() {
            let code = document.getElementById("code").value;
            let btn = document.getElementById("copyBtn");
            
            navigator.clipboard.writeText(code).then(() => {
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                btn.classList.add("success");
                setTimeout(() => {
                    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                    btn.classList.remove("success");
                }, 2000);
            }).catch(() => {
                // Fallback for file:// protocol
                var textarea = document.createElement("textarea");
                textarea.value = code;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                btn.classList.add("success");
                setTimeout(() => {
                    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                    btn.classList.remove("success");
                }, 2000);
            });
        }

        function copyQQ() {
            navigator.clipboard.writeText("666181683");
        }
        function copyQQ2() {
            navigator.clipboard.writeText("64743885");
        }
        function copyWeChat() {
            navigator.clipboard.writeText("zyzcfc");
        }
    </script>
