<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>赵财期权末日轮策略 - 试用版授权码申请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a0a 50%, #0a0a0f 100%);
            color: #fff;
            overflow: hidden;
        }
        .fire-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .fire-glow:nth-of-type(1) {
            top: -200px;
            right: -100px;
        }
        .fire-glow:nth-of-type(2) {
            bottom: -200px;
            left: -100px;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }
        .card {
            background: linear-gradient(145deg, rgba(20, 15, 15, 0.95), rgba(10, 10, 15, 0.95));
            border-radius: 20px;
            padding: 28px 24px;
            border: 1px solid rgba(255, 107, 53, 0.15);
            backdrop-filter: blur(20px);
        }
        .title-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff6b35, #ffd700, #ff6b35);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
            white-space: nowrap;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .motto {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            color: #4b5563;
            margin-bottom: 10px;
        }
        .live-clock {
            text-align: center;
            padding: 8px 0;
            border-top: 1px solid rgba(75, 85, 99, 0.2);
            border-bottom: 1px solid rgba(75, 85, 99, 0.2);
            margin-bottom: 16px;
        }
        .clock-time {
            font-size: 22px;
            font-weight: bold;
            color: #f59e0b;
            font-family: 'Courier New', monospace;

        }
        .clock-time.blink {

        }
        @keyframes blink-dot {

        }
        .clock-label {

        }
        .history-box {
            background: rgba(10, 10, 15, 0.5);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .history-title {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(75, 85, 99, 0.2);
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            background: rgba(255, 255, 255, 0.05);

        .input-field {

        @keyframes shake {

            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }

        .btn {

            border-radius: 12px;

        .btn:disabled {

        @media (min-width: 768px) {
            .btn:hover {

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

        .code-box {
            background: rgba(10, 10, 15, 0.5);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .code-header {

        .code-textarea {
            width: 100%;

            border-radius: 8px;
            padding: 8px 10px;
            color: #ffd700;

        }
        .info-grid {
            display: grid;

        }
        .info-box {
            background: rgba(10, 10, 15, 0.5);

        }
        .info-label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 13px;
            font-weight: bold;

        }
        .info-value.gold {

        }
        .member-box {

            padding: 8px;

        }
        .member-text {

        }
        .date-line {
            text-align: center;
            padding: 8px 0;
            margin-bottom: 12px;
        }
        .date-label {
            font-size: 12px;
            color: #6b7280;
        }
        .date-value {
            font-size: 14px;
            color: #f59e0b;

            font-family: 'Courier New', monospace;

        }
        .countdown-box {

            padding: 8px;
            margin-bottom: 12px;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 8px;
        }
        .countdown-label {
            font-size: 11px;
            color: #6b7280;
        }
        .countdown-value {
            font-size: 15px;
            font-weight: bold;
            color: #f59e0b;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .link-section {
            margin-top: 20px;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;

        }

        }
        .link-item a {
            color: #ff6b35;

        }
        .link-item a:hover {

        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .spin-wrench {
            display: inline-block;
            animation: wrench-spin 2s ease-in-out infinite;
        }
        @keyframes wrench-spin {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(30deg); }
            40% { transform: rotate(-20deg); }
            60% { transform: rotate(15deg); }
            80% { transform: rotate(-10deg); }

        .hidden {
            display: none !important;
        }

        /* Mobile responsive styles */
        @media (max-width: 480px) {
            .title {
                font-size: 15px;
            }
            .subtitle {

            }
            .motto {
                font-size: 10px;
            }
            .clock-time {
                font-size: 18px;
            }
            .input-field {
                font-size: 14px;
                padding: 12px 14px;
            }
            .btn {
                font-size: 14px;
                padding: 12px;
            }
            .code-textarea {
                font-size: 11px;
            }
            .info-label {
                font-size: 10px;
            }
            .info-value {
                font-size: 12px;
            }
            .member-text {

            }

            }

            }

            }

            }

    </style>
</head>
<body>
    <div class="fire-glow"></div>
    <div class="fire-glow"></div>
    <div class="container">
        <div class="card">
            <div class="title-section">
                <div class="title">
                    <span>⚔️</span>
                    <span>赵财期权末日轮策略</span>
                    <span>🔥</span>
                </div>
                <p class="subtitle">试用版授权码申请</p>
                <div class="motto">
                    <span>定时重启</span>
                    <span>·</span>
                    <span>无限迭代</span>

                </div>
                <div class="live-clock">

            </div>

            <div id="historyBox" class="history-box hidden">

                    <label class="input-label">战友智大领峰用户名</label>

            </div>

            <div id="result" class="result-section hidden">
                <div id="codeBox" class="code-box">
                    <div class="code-header">
                        <span class="code-label">授权码</span>
                        <button id="copyBtn" class="copy-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <textarea id="code" class="code-textarea" readonly></textarea>
                </div>

                <div class="info-grid">
                    <div class="info-box">
                        <div class="info-label">战友智大领峰用户名</div>
                        <div id="showUid" class="info-value"></div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">授权到期日</div>
                        <div id="showExpire" class="info-value gold"></div>
                    </div>
                </div>

                <div class="member-box">
                    <p id="memberCount" class="member-text"></p>
                </div>

                <div id="dateLine" class="date-line hidden">
                    <span class="date-label">授权申请日期</span>
                    <span id="showDate" class="date-value"></span>
                </div>

                <div id="countdownBox" class="countdown-box hidden">
                    <span class="countdown-label">距到期还有</span>
                    <span id="countdownValue" class="countdown-value">-- 天</span>
                </div>
            </div>

            <div id="linkSection" class="link-section">
                <div class="link-item">
                    <span class="link-icon">💬</span>
                    <span>QQ群：</span>
                    <span onclick="copyQQ()" style="color: #ff6b35; cursor: pointer;">666181683</span>
                </div>
                <div class="link-item">
                    <span class="link-icon">📖</span>
                    <a href="https://docs.qq.com/doc/DQ3RsSHpPV1hQTmdp" target="_blank">腾讯文档 · 赵财末日轮主观策略使用说明书</a>
                </div>
            </div>
        </div>

        <div id="footerSection" class="footer">
            <span>💪</span>
            <span>末日边缘 搞钱联盟</span>
            <span class="spin-wrench">🔧</span>
        </div>
    </div>

    <script>
        const ACCOUNT_CODES_KEY = 'zhaocai_auth_codes';
        const USED_ACCOUNTS_KEY = 'zhaocai_used_accounts';
        const TRIAL_DAYS = 30;
        const mapTable = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const CoreSecret = 8888;

        function getExpireNum(date) {
            let y = date.getFullYear();
            let m = String(date.getMonth() + 1).padStart(2, '0');
            let d = String(date.getDate()).padStart(2, '0');
            return parseInt(y + m + d);
        }

        function formatDate(date) {
            return date.getFullYear() + '-' + 
                   String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(date.getDate()).padStart(2, '0');
        }

        function getUsedAccounts() { try { return JSON.parse(localStorage.getItem(USED_ACCOUNTS_KEY) || '[]'); } catch(e) { return []; } }
        function getAccountCodes() { try { return JSON.parse(localStorage.getItem(ACCOUNT_CODES_KEY) || '{}'); } catch(e) { return {}; } }
        function getAccountCode(uid) { let codes = getAccountCodes(); return codes[uid] || null; }

        function saveAccountCode(uid, code, uidSum, expireDate, expireNum) {
            let accountCodes = getAccountCodes();
            accountCodes[uid] = { code, uidSum, time: Date.now(), expireDate, expireNum };
            localStorage.setItem(ACCOUNT_CODES_KEY, JSON.stringify(accountCodes));
        }

        function saveUsedAccount(uid) {
            let usedAccounts = getUsedAccounts();
            if (!usedAccounts.includes(uid)) {
                usedAccounts.push(uid);
                localStorage.setItem(USED_ACCOUNTS_KEY, JSON.stringify(usedAccounts));
            }
        }

        function calculateSerial(uid, expireNum) {
            let uidSum = 0;
            for (let i = 1; i < uid.length; i++) {
                let c = uid[i];
                let v = mapTable.indexOf(c) + 1;
                uidSum += v;
            }
            uidSum += 1;
            let salt = uidSum * 10000 + CoreSecret;
            let v1 = expireNum * 3 + CoreSecret + salt;
            let v2 = expireNum + salt + CoreSecret + 99999;
            let serial = "1" + v1 + CoreSecret + v2;
            return { serial, uidSum };
        }

        // --- Live Clock ---
        function updateClock() {
            let now = new Date();
            let h = String(now.getHours()).padStart(2, '0');
            let m = String(now.getMinutes()).padStart(2, '0');
            let s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockTime').textContent = h + ':' + m + ':' + s;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Countdown Timer ---
        let countdownTimer = null;

        function startCountdown(expireDateStr) {
            stopCountdown();
            let expireDate = new Date(expireDateStr + 'T23:59:59+08:00');
            
            function tick() {
                let now = new Date();
                let diff = expireDate - now;
                if (diff <= 0) {
                    document.getElementById('countdownValue').textContent = '已到期';
                    return;
                }
                let days = Math.floor(diff / (1000 * 60 * 60 * 24));
                let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('countdownValue').textContent = days + ' 天 ' + hours + ' 时 ' + mins + ' 分';
            }
            tick();
            countdownTimer = setInterval(tick, 60000);
        }

        function stopCountdown() {
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        }

        // --- History ---
        function showHistory(uid) {
            let accountCodes = getAccountCodes();
            let historyBox = document.getElementById('historyBox');
            let historyList = document.getElementById('historyList');
            if (!accountCodes[uid]) {
                historyBox.classList.add('hidden');
                return;
            }
            let data = accountCodes[uid];
            historyBox.classList.remove('hidden');
            historyList.innerHTML = '';
            let item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-item-header">
                    <div class="history-item-name">用户名: ${uid}</div>
                    <div class="history-item-expire">到期日: ${data.expireDate || '未设置'}</div>
                </div>
                <div class="history-item-code">${data.code}</div>
                <div class="history-item-hint">点击复制授权码</div>
            `;
            item.onclick = function() { copyCodeText(data.code); };
            historyList.appendChild(item);
        }

        // --- Copy ---
        function copyCodeText(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                } else {
                    let ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
            } catch(e) {}
        }

        function fallbackCopy(text, btn) {
            let textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                btn.classList.add("success");
                setTimeout(() => {
                    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                    btn.classList.remove("success");
                }, 2000);
            } catch(e) {}
            document.body.removeChild(textarea);
        }

        function copyCode() {
            let code = document.getElementById("code").value;
            let btn = document.getElementById("copyBtn");
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(() => {
                    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                    btn.classList.add("success");
                    setTimeout(() => {
                        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                        btn.classList.remove("success");
                    }, 2000);
                }).catch(() => fallbackCopy(code, btn));
            } else {
                fallbackCopy(code, btn);
            }
        }

        function copyQQ() { try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("666181683"); } catch(e) {} }
        function copyQQ2() { try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("64743885"); } catch(e) {} }
        function copyWeChat() { try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("zyzcfc"); } catch(e) {} }

        // --- Show Result ---
        function showResult(code, uid, expireStr, userNum) {
            document.getElementById("code").value = code;
            document.getElementById("showUid").innerText = uid;
            document.getElementById("showExpire").innerText = expireStr;
            document.getElementById("memberCount").innerText = '💪 你是第 ' + (userNum || '?') + ' 位战友，你并不孤单！ 🕶️';
            document.getElementById("result").classList.remove("hidden");
            document.getElementById("alertBox") && document.getElementById("alertBox").classList.add("hidden");
        }

        function hideFormAndCode() {
            document.getElementById("codeBox").classList.add("hidden");
            document.getElementById("formSection").classList.add("hidden");
            document.querySelector(".info-grid").classList.add("hidden");
            document.querySelector(".member-box").classList.add("hidden");
            document.getElementById("dateLine").classList.remove("hidden");
            document.getElementById("countdownBox").classList.remove("hidden");
        }

        function showDateLine(expireStr) {
            document.getElementById("showDate").innerText = expireStr;
            startCountdown(expireStr);
        }

        // --- Main ---
        function generateLocal(uid, trialDays) {
            let now = new Date();
            let expireDate = new Date(now.getTime() + trialDays * 24 * 60 * 60 * 1000);
            let expireNum = getExpireNum(expireDate);
            let expireStr = formatDate(expireDate);
            let result = calculateSerial(uid, expireNum);
            let userNum = (result.uidSum % 100) + 101;
            return { code: result.serial, expireStr, expireNum, uidSum: result.uidSum, userNum };
        }

        async function go() {
            let uid = document.getElementById("uid").value.toUpperCase().trim();
            let inputField = document.getElementById("uid");
            let alertBox = document.getElementById("alertBox");
            let btn = document.getElementById("mainBtn");
            
            if (!uid) { inputField.classList.add("shake"); setTimeout(() => inputField.classList.remove("shake"), 500); return; }
            
            btn.disabled = true;
            btn.innerHTML = '<span>⚔️</span><span>处理中...</span><span>⚔️</span>';
            
            try {
                let controller = new AbortController();
                let timeoutId = setTimeout(() => controller.abort(), 4000);
                try {
                    var response = await fetch(
                        `https://1328173883-dz4q4z8i5a.ap-shanghai.tencentscf.com?uid=${encodeURIComponent(uid)}`,
                        { signal: controller.signal }
                    );
                } finally { clearTimeout(timeoutId); }
                let data = await response.json();
                
                if (data.success) {
                    let existing = getAccountCode(uid);
                    if (existing) {
                        // Old user or returning user: show history
                        showResult(existing.code, uid, existing.expireDate, existing.uidSum);
                        hideFormAndCode();
                        showDateLine(existing.expireDate);
                        document.getElementById('historyBox').classList.remove('hidden');
                        showHistory(uid);
                    } else {
                        // New user first time: don't show history
                        try { saveUsedAccount(uid); saveAccountCode(uid, data.data.code, data.data.userNum, data.data.expire, getExpireNum(new Date(data.data.expire))); } catch(e) {}
                        showResult(data.data.code, uid, data.data.expire, data.data.userNum);
                    }
                } else {
                    if (data.hasHistory && data.data) {
                        try {
                            let existing = getAccountCode(uid);
                            if (!existing) { saveUsedAccount(uid); saveAccountCode(uid, data.data.code, data.data.userNum, data.data.expire, getExpireNum(new Date(data.data.expire))); }
                        } catch(e) {}
                        showResult(data.data.code, uid, data.data.expire, data.data.userNum);
                        hideFormAndCode();
                        showDateLine(data.data.expire);
                        document.getElementById('historyBox').classList.remove('hidden');
                        showHistory(uid);
                    }
                }
            } catch (error) {
                console.error('API失败:', error);
                try {
                    let existing = getAccountCode(uid);
                    if (existing) {
                        // Old user or returning user: show history
                        showResult(existing.code, uid, existing.expireDate, existing.uidSum);
                        hideFormAndCode();
                        showDateLine(existing.expireDate);
                        document.getElementById('historyBox').classList.remove('hidden');
                        showHistory(uid);
                    } else {
                        // New user first time: don't show history
                        let local = generateLocal(uid, TRIAL_DAYS);
                        try { saveUsedAccount(uid); saveAccountCode(uid, local.code, local.uidSum, local.expireStr, local.expireNum); } catch(e) {}
                        showResult(local.code, uid, local.expireStr, local.userNum);
                    }
                } catch(e) {
                    let local = generateLocal(uid, TRIAL_DAYS);
                    showResult(local.code, uid, local.expireStr, local.userNum);
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>⚔️</span><span>申请授权码</span><span>⚔️</span>';
            }
        }

        // Check if user has existing account (for returning users)
        function checkExistingUser() {
            let accountCodes = getAccountCodes();
            let usedAccounts = getUsedAccounts();
            
            if (usedAccounts.length > 0) {
                let lastUid = usedAccounts[usedAccounts.length - 1];
                let existing = accountCodes[lastUid];
                
                if (existing) {
                    // Old user: show history, expire date and countdown directly
                    document.getElementById('formSection').classList.add('hidden');
                    document.getElementById('historyBox').classList.remove('hidden');
                    showHistory(lastUid);
                    showResult(existing.code, lastUid, existing.expireDate, existing.uidSum);
                    hideFormAndCode();
                    showDateLine(existing.expireDate);
                    return true;
                }
            }
            return false;
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const mainBtn = document.getElementById('mainBtn');
            const copyBtn = document.getElementById('copyBtn');
            
            // For both click and touch events
            function handleMainBtn(e) {
                e.preventDefault();
                if (!mainBtn.disabled) go();
            }
            
            function handleCopyBtn(e) {
                e.preventDefault();
                copyCode();
            }
            
            mainBtn.addEventListener('click', handleMainBtn);
            mainBtn.addEventListener('touchend', handleMainBtn);
            
            copyBtn.addEventListener('click', handleCopyBtn);
            copyBtn.addEventListener('touchend', handleCopyBtn);
        });
    </script>
</body>
